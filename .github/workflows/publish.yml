name: Publish npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish and update tags
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ACCESS=$(node -p "require('./package.json').publishConfig.access")
          TAG=$(node -p "require('./package.json').publishConfig.tag")
          REGISTRY=$(node -p "require('./package.json').publishConfig.registry")

          npm view "$NAME@$VERSION" version --registry="$REGISTRY" >/dev/null 2>&1 ||
            npm publish --access="$ACCESS" --tag=latest --registry="$REGISTRY"

          npm dist-tag add "$NAME@$VERSION" "$TAG" --registry="$REGISTRY"
          npm dist-tag ls "$NAME" --registry="$REGISTRY"
